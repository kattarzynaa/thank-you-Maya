<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Maya</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/kattarzynaa/thank-you-Maya/refs/heads/main/m_favicon2.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b2b2b;
            color: white;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        h1 {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 72px;
            margin-bottom: 80px;
            font-weight: 700;
        }

    

        .section {
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 24px;
        }

        .embed-wrapper {
            border: 6px solid #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        .embed-wrapper iframe {
            display: block;
            width: 100%;
        }

      
        .signature {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 72px;
            margin-bottom: 80px;
            font-weight: 700;
        }

        .bottom-image {
            width: 100%;
            display: block;
        }

        .media-section {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;
    align-items: start;
    margin-bottom: 80px;
}

.media-card h2 {
    font-size: 28px;
    margin-bottom: 20px;
}

.spotify-wrapper iframe,
.embed-wrapper iframe {
    width: 100%;
}

@media (max-width: 900px) {
    .media-section {
        grid-template-columns: 1fr;
    }
}

        @media (max-width: 768px) {
            h1 {
                font-size: 54px;
            }

            .section-title,
            .signature {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Thank you Maya!</h1>

        <section class="media-section">

    <div class="media-card">
        <h2 class="section-title">💌 A Few Words for You</h2>

        <div class="embed-wrapper">
            <iframe
                width="100%"
                height="400"
                src="https://www.youtube-nocookie.com/embed/ldCW34h1yfg?si=8E0DwVZWUb0VJUNy"
                title="YouTube video player"
                frameborder="0"
                 referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
        <a style="color: white;"href="https://drive.google.com/file/d/1KMM-yIyhuIoh86_VNm5gGYjTULNfyOyk/view?usp=sharing" target="_blank">Download video ⤵</a>
    </div>
    

    <div class="media-card">
        <h2 class="section-title">🎵 Listen on Repeat</h2>

        <div class="spotify-wrapper">
            <iframe
                style="border-radius:12px"
                src="https://open.spotify.com/embed/playlist/1dfqGlXRnZfBzDK0iATfbx?utm_source=generator"
                width="100%"
                height="400"
                frameborder="0"
                allowfullscreen
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                >
            </iframe>
        </div>
    </div>

</section>

        <section class="section">
                        <img
    class="bottom-image"
    src="https://raw.githubusercontent.com/kattarzynaa/thank-you-Maya/refs/heads/main/thank_you_maya_img_page.png"
    alt="Thank You Maya">
